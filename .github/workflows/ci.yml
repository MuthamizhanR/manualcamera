name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android NDK and CMake
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;22.1.7171670" "cmake;3.22.1"

    - name: Restore native third-party libraries
      id: thirdparty-cache
      uses: actions/cache@v4
      with:
        path: |
          libMotionCam/thirdparty/opencv
          libMotionCam/thirdparty/expat
          libMotionCam/thirdparty/exiv2
          libMotionCam/thirdparty/zstd
        key: thirdparty-android-arm64-v8a-${{ hashFiles('scripts/build-thirdparty-android.sh') }}

    - name: Build native third-party libraries (OpenCV, exiv2, expat, zstd)
      if: steps.thirdparty-cache.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK="$ANDROID_HOME/ndk/22.1.7171670"
        scripts/build-thirdparty-android.sh

    - name: Build with Gradle
      working-directory: MotionCam-Android
      run: ./gradlew assembleDebug

    - name: Run C++ decoder tests
      run: |
        cmake -S reference/motioncam-decoder -B build_decoder -DBUILD_TESTING=ON
        cmake --build build_decoder
        ctest --test-dir build_decoder --output-on-failure

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-debug-apk
        path: MotionCam-Android/MotionCam/build/outputs/apk/debug/*.apk
